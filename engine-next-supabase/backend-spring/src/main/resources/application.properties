# Application
server.port=${PORT:5000}
spring.application.name=notification-engine

# PostgreSQL / Supabase Pooler (credentials embedded in URL for pooler compatibility)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway — use same URL with embedded credentials
spring.flyway.url=${DATABASE_URL}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — same secret as Node.js backend
jwt.secret=${JWT_SECRET:supersecretkey}
jwt.expiration-ms=86400000

# AI Service — Groq (reads same env vars as Node.js backend)
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:${MODEL_NAME:llama-3.3-70b-versatile}}

# AI Service — Gemini (fallback)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${MODEL_NAME:gemini-flash-latest}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.cyepro.engine=INFO
